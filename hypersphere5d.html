<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5次元球（S⁴）の3D投影</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#030712;color:#e5e7eb;font:13px/1.4 system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;user-select:none}
#view{position:relative;flex:1;min-height:0;touch-action:none}
#view canvas{position:absolute;left:0;top:0}
#fps{position:absolute;right:8px;top:8px;padding:3px 8px;border-radius:8px;background:#0f172ae6;font:11px monospace;pointer-events:none}
#info{position:absolute;left:8px;bottom:8px;padding:5px 10px;border-radius:10px;background:#0f172ae6;font:11px monospace;white-space:pre;pointer-events:none}
#panel{padding:8px;background:#0a0f1df0;border-top:1px solid #1e293b;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px;max-height:42vh;overflow:auto}
.row{display:flex;gap:6px;align-items:center}
.row label{width:96px;color:#cbd5e1}
.row input[type=range]{flex:1;min-width:0}
.row output{width:48px;text-align:right;font:11px monospace;color:#94a3b8}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:#162136;color:#e5e7eb;border:1px solid #334155;border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit}
button.on{background:#0e7490;border-color:#38bdf8}
</style>
</head>
<body>
<div id="view"><div id="info"></div><div id="fps"></div></div>
<div id="panel">
  <div class="bar">
    <button id="bAll">▶ 全部自動</button><button id="bW">W系だけ</button><button id="bV">V系だけ</button><button id="bDbl">ダブル回転（X-W＋Y-V）</button><button id="bStop">停止</button><button id="bReset">リセット</button>
  </div>
  <div id="rot" style="display:contents"></div>
  <div class="row"><label>自動の速さ</label><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><output id="spdO"></output></div>
  <div class="row"><label>パースV</label><input id="cv" type="range" min="2.5" max="8" step="0.1" value="4.5"><output id="cvO"></output></div>
  <div class="row"><label>パースW</label><input id="cw" type="range" min="2.5" max="8" step="0.1" value="4.5"><output id="cwO"></output></div>
  <div class="row"><label>v層の数</label><input id="nv" type="range" min="3" max="31" step="1" value="7"><output id="nvO"></output></div>
  <div class="row"><label>w層の数</label><input id="nw" type="range" min="3" max="31" step="1" value="9"><output id="nwO"></output></div>
  <div class="row"><label>線の濃さ</label><input id="op" type="range" min="0.1" max="1" step="0.05" value="0.5"><output id="opO"></output></div>
</div>

<script>
// 5次元球 S⁴: x²+y²+z²+w²+v² = R²（5D空間 x,y,z,w,v）
// 殻のパラメータ: ψ（v=R·cosψ）と θ（w=R·sinψ·cosθ）。各 (ψ,θ) で半径 ρ=R·sinψ·sinθ の3D球殻（xyz）になる。
const R = 1.3, SC = 1.4, TAU = Math.PI * 2;
let N = 9, M = 7;   // w層・v層の数
const PL = [['X-W', 0, 3], ['Y-W', 1, 3], ['Z-W', 2, 3], ['X-V', 0, 4], ['Y-V', 1, 4], ['Z-V', 2, 4], ['W-V', 3, 4]];
const RATE = [1, 0.77, 0.61, 0.53, 0.43, 0.37, 0.29];   // 平面ごとの速さの比（同じ姿勢に戻りにくくする）
const ang = PL.map(() => 0), auto = PL.map(() => false);
let spd = 1, camV = 4.5, camW = 4.5, op = 0.5;
const $ = id => document.getElementById(id);
const deg = a => (a * 180 / Math.PI).toFixed(0) + '°';
const norm = a => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };

// ---- three.js ----
const view = $('view'), scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100); cam.position.set(0, 0, 7.5);
const ren = new THREE.WebGLRenderer({ antialias: true, alpha: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2)); view.appendChild(ren.domElement);
const ctl = new THREE.OrbitControls(cam, ren.domElement); ctl.enableDamping = true; ctl.dampingFactor = 0.06;
function resize() { const w = view.clientWidth, h = view.clientHeight; if (!w || !h) return; ren.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize);

// ---- 殻 ----
const shells = [];
function applyOp() {   // 殻が増えるほど1枚あたりを薄くして、真っ白にならないようにする
  const e = Math.max(0.06, op * Math.min(1, Math.sqrt(60 / (N * M))));
  shells.forEach(S => S.mesh.material.opacity = e);
}
function build() {
  while (shells.length) { const S = shells.pop(); scene.remove(S.mesh); S.geo.dispose(); S.mesh.material.dispose(); }
  const tot = N * M, sw = tot > 400 ? 8 : tot > 200 ? 10 : tot > 100 ? 12 : 14, sh = tot > 400 ? 5 : tot > 200 ? 6 : tot > 100 ? 8 : 9;   // 殻が多いときは1枚あたりの分割を粗くして軽くする
  for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) {
    const psi = (j + 0.5) / M * Math.PI, th = (i + 0.5) / N * Math.PI;
    const rho = R * Math.sin(psi) * Math.sin(th), w = R * Math.sin(psi) * Math.cos(th), v = R * Math.cos(psi);
    const geo = new THREE.SphereGeometry(1, sw, sh), base = Float32Array.from(geo.attributes.position.array);
    const col = new THREE.Color().setHSL(0.85 * psi / Math.PI, 0.9, 0.45 + 0.2 * Math.sin(th));   // 色: v方向の位置（赤=v+ → 紫=v-）
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: col, wireframe: true, transparent: true, opacity: op, depthWrite: false }));
    mesh.frustumCulled = false; scene.add(mesh);
    shells.push({ geo, base, rho, w, v, mesh });
  }
  applyOp();
}
build();
// 軸の目印: ±R の点（x=赤 y=緑 z=青 w=黄 v=マゼンタ）
const AXC = [[1, .3, .3], [.3, 1, .3], [.4, .6, 1], [1, .9, .2], [1, .3, 1]];
const axPts = []; for (let a = 0; a < 5; a++) for (const s of [1, -1]) axPts.push({ a, s });
const axG = new THREE.BufferGeometry();
axG.setAttribute('position', new THREE.BufferAttribute(new Float32Array(10 * 3), 3));
axG.setAttribute('color', new THREE.BufferAttribute(new Float32Array(axPts.flatMap(p => AXC[p.a].map(c => c * (p.s > 0 ? 1 : 0.45)))), 3));
const axM = new THREE.Points(axG, new THREE.PointsMaterial({ size: 9, sizeAttenuation: false, vertexColors: true, depthTest: false }));
axM.frustumCulled = false; axM.renderOrder = 5; scene.add(axM);

// ---- 5D回転 + 2段の遠近投影（v → w）----
let st = [];
function mk() { st = PL.map(([, i, j], k) => [i, j, Math.cos(ang[k]), Math.sin(ang[k])]); }
const p5 = [0, 0, 0, 0, 0];
function proj(out, k) {
  for (const [i, j, c, s] of st) { const t = p5[i] * c - p5[j] * s; p5[j] = p5[i] * s + p5[j] * c; p5[i] = t; }
  const s1 = camV / Math.max(0.6, camV - p5[4]), w1 = p5[3] * s1, s2 = camW / Math.max(0.6, camW - w1) * s1 * SC;
  out[k] = p5[0] * s2; out[k + 1] = p5[1] * s2; out[k + 2] = p5[2] * s2;
}
function update() {
  mk();
  for (const S of shells) {
    const a = S.geo.attributes.position, arr = a.array, b = S.base;
    for (let k = 0; k < arr.length; k += 3) {
      p5[0] = b[k] * S.rho; p5[1] = b[k + 1] * S.rho; p5[2] = b[k + 2] * S.rho; p5[3] = S.w; p5[4] = S.v;
      proj(arr, k);
    }
    a.needsUpdate = true;
  }
  const pa = axG.attributes.position.array;
  axPts.forEach((P, n) => { p5.fill(0); p5[P.a] = P.s * R; proj(pa, n * 3); });
  axG.attributes.position.needsUpdate = true;
  $('info').textContent = PL.map(([n], k) => `${n}: ${deg(ang[k])}${auto[k] ? ' ⟳' : ''}`).join('\n') +
    `\n殻 ${shells.length} 枚（v層${M} × w層${N}） 頂点 ${shells.reduce((a, S) => a + S.base.length / 3, 0)}\n点: 赤x 緑y 青z 黄w 紫v（暗い=負側）`;
}

// ---- UI ----
const rows = PL.map(([n], k) => {
  const d = document.createElement('div'); d.className = 'row';
  d.innerHTML = `<label><input type="checkbox"> ${n}</label><input type="range" min="-180" max="180" step="1" value="0"><output></output>`;
  $('rot').appendChild(d);
  const [cb, rg] = d.querySelectorAll('input'), o = d.querySelector('output');
  cb.onchange = () => { auto[k] = cb.checked; };
  rg.oninput = () => { ang[k] = +rg.value * Math.PI / 180; update(); };
  return { cb, rg, o };
});
function sync() { rows.forEach((r, k) => { r.cb.checked = auto[k]; r.rg.value = ang[k] * 180 / Math.PI; r.o.textContent = deg(ang[k]); }); }
const setAuto = f => { auto.forEach((_, k) => auto[k] = f(k)); sync(); };
$('bAll').onclick = () => setAuto(() => true);
$('bW').onclick = () => setAuto(k => k < 3);
$('bV').onclick = () => setAuto(k => k >= 3 && k < 6);
$('bDbl').onclick = () => setAuto(k => k === 0 || k === 4);     // 2つの独立した回転面を同時に回す = 5D特有の「ダブル回転」
$('bStop').onclick = () => setAuto(() => false);
$('bReset').onclick = () => { ang.fill(0); setAuto(() => false); update(); };
const bind = (id, f) => { const e = $(id), o = $(id + 'O'); e.oninput = () => { f(+e.value); o.textContent = e.value; update(); }; o.textContent = e.value; };
bind('spd', v => spd = v); bind('cv', v => camV = v); bind('cw', v => camW = v);
bind('op', v => { op = v; applyOp(); });
bind('nv', v => { M = v; build(); }); bind('nw', v => { N = v; build(); });

let fpsV = 60, tPrev = performance.now(), fN = 0;
(function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(); fpsV += (1000 / Math.max(1, now - tPrev) - fpsV) * 0.1; tPrev = now;
  if (++fN % 20 === 0) $('fps').textContent = fpsV.toFixed(0) + ' fps';
  if (auto.some(Boolean)) { auto.forEach((a, k) => { if (a) ang[k] = norm(ang[k] + 0.01 * spd * RATE[k]); }); update(); sync(); }
  ctl.update(); ren.render(scene, cam);
})();
resize(); update(); sync();
</script>
</body>
</html>
