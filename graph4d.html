<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>複素グラフ 4D</title>
<link rel="icon" type="image/svg+xml" href="icons/graph.svg">
<link rel="apple-touch-icon" href="icons/graph-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#030712">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
    :root {
        --bg: #030712; --card: rgba(9, 14, 28, 0.88); --line: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --faint: #64748b;
        --lime: #a3e635; --rex: #ff5d6c; --imx: #56a8ff; --rey: #3ddc84; --imy: #b07cff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, 'Hiragino Sans', sans-serif; overflow: hidden; }
    #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .lab { position: absolute; transform: translate(-50%, -50%); font: 700 12px Inter, system-ui, sans-serif; white-space: nowrap; text-shadow: 0 0 6px #000, 0 0 2px #000; }
    .lab.root { font: 600 11px ui-monospace, 'SF Mono', Menlo, monospace; color: #ecfccb; transform: translate(10px, -130%); }
    .lab.root.hot { color: var(--lime); font-size: 13px; }

    .top {
        position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
        background: linear-gradient(to bottom, rgba(3, 7, 18, 0.92), rgba(3, 7, 18, 0));
    }
    .back { color: var(--faint); text-decoration: none; font-size: 13px; }
    .back:hover { color: var(--text); }
    h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
    h1 b { color: var(--imy); }
    .eq { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 36px; flex: 1 1 260px; max-width: 460px; }
    .eq span { font: italic 500 15px 'Times New Roman', serif; color: var(--muted); }
    .eq input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font: 500 15px ui-monospace, 'SF Mono', Menlo, monospace; }
    select { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 0 8px; font-size: 13px; max-width: 280px; }
    .err { position: fixed; left: 14px; top: 60px; color: #fb7185; font-size: 12px; background: var(--card); border: 1px solid #4c0519; border-radius: 8px; padding: 4px 10px; }
    .err[hidden] { display: none; }

    .panel-btn {
        position: fixed; right: 12px; top: 58px; width: 40px; height: 40px; border-radius: 12px; z-index: 3;
        border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 18px; cursor: pointer;
    }
    .panel {
        position: fixed; right: 12px; top: 106px; bottom: 12px; width: 300px; overflow-y: auto; z-index: 2;
        background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px 14px;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .panel[hidden] { display: none; }
    .panel section { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .panel section:last-child { border-bottom: 0; }
    .panel h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; display: flex; justify-content: space-between; }
    .plane { display: grid; grid-template-columns: 1fr 34px; gap: 2px 8px; align-items: center; margin-bottom: 8px; }
    .plane .nm { font-size: 12px; }
    .plane .nm small { color: var(--faint); }
    .plane input[type=range] { grid-column: 1; width: 100%; accent-color: var(--imy); }
    .plane button { grid-row: 1 / span 2; grid-column: 2; }
    .btn {
        height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted);
        font-size: 12px; cursor: pointer; padding: 0 10px;
    }
    .btn:hover { color: var(--text); border-color: #334155; }
    .btn.on { color: #e9d5ff; border-color: var(--imy); background: rgba(76, 29, 149, 0.45); }
    .btn.lime.on { color: #ecfccb; border-color: var(--lime); background: rgba(63, 98, 18, 0.5); }
    .views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .views .btn { height: auto; min-height: 34px; padding: 5px 8px; text-align: left; line-height: 1.3; }
    .views .btn small { display: block; color: var(--faint); font-size: 10.5px; }
    .seg { display: flex; gap: 4px; flex-wrap: wrap; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
    .row input[type=range] { flex: 1; accent-color: var(--lime); }
    .row .v { font: 500 12px ui-monospace, Menlo, monospace; color: var(--text); min-width: 36px; text-align: right; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
        font: 500 12px ui-monospace, 'SF Mono', Menlo, monospace; color: #ecfccb; cursor: pointer;
        border: 1px solid rgba(163, 230, 53, 0.4); background: rgba(63, 98, 18, 0.25); border-radius: 999px; padding: 3px 10px;
    }
    .chip:hover, .chip.hot { border-color: var(--lime); color: #fff; background: rgba(101, 163, 13, 0.45); }
    .note { font-size: 11px; color: var(--faint); margin-top: 6px; line-height: 1.5; }
    .param { margin-bottom: 6px; }
    .legend {
        position: fixed; left: 12px; bottom: 12px; max-width: min(640px, calc(100% - 340px)); z-index: 1;
        background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px;
        font-size: 11.5px; color: var(--muted); line-height: 1.6; pointer-events: none;
    }
    .legend i { font-style: normal; font-weight: 700; }
    /* グラフ電卓の中にはめ込んだ時（?embed=1） */
    body.embed .top { display: none; }
    body.embed .panel-btn { left: 10px; right: auto; top: 10px; bottom: auto; }
    body.embed .panel { left: 10px; right: auto; top: 58px; bottom: 10px; width: 290px; max-height: none; }
    body.embed .legend { left: 10px; right: 64px; bottom: 8px; top: auto; max-width: none; font-size: 10.5px; padding: 4px 8px; }
    body.embed .err { top: 12px; left: 60px; }
    body.embed #paramSec { display: none !important; }
    .popout { display: none; }
    body.embed .popout { display: inline-flex; align-items: center; text-decoration: none; }
    @media (max-width: 760px) {
        .panel { left: 12px; right: 12px; width: auto; top: auto; max-height: 55vh; }
        .legend { max-width: calc(100% - 76px); font-size: 10.5px; }
        .panel-btn { top: auto; bottom: 12px; }
    }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<header class="top">
    <a class="back" href="graph.html">← グラフ電卓</a>
    <h1>複素グラフ <b>4D</b></h1>
    <label class="eq"><span>y =</span><input id="expr" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="x^2+1"></label>
    <select id="preset"><option value="">例を読み込む…</option></select>
</header>
<div class="err" id="err" hidden></div>
<button class="panel-btn" id="panelBtn" type="button" title="パネルの表示／非表示">⚙</button>
<aside class="panel" id="panel">
    <section class="popout" style="border-bottom:0;padding-bottom:0">
        <a class="btn popout" id="popout" href="graph4d.html" target="_blank" rel="noopener">別ページで大きく開く ↗</a>
    </section>
    <section>
        <h3>4 次元の回転 <button class="btn" id="spinAll" type="button">回す</button></h3>
        <div id="planes"></div>
        <div class="row">速さ<input type="range" id="speed" min="0.1" max="3" step="0.05"><span class="v" id="speedV"></span></div>
    </section>
    <section>
        <h3>見え方（軸を消す）</h3>
        <div class="views" id="views"></div>
    </section>
    <section>
        <h3>解（y = 0）<span id="rootCount"></span></h3>
        <div class="chips" id="roots"></div>
        <div class="row"><button class="btn" id="fitRoots" type="button">解が全部入る範囲にする</button></div>
        <div class="note">解は x の複素数平面（床）の上の光る点。どの向きに回しても見えるように、いちばん手前に描きます。</div>
    </section>
    <section id="paramSec" hidden>
        <h3>パラメータ</h3>
        <div id="params"></div>
    </section>
    <section>
        <h3>色</h3>
        <div class="seg" id="colors">
            <button class="btn" type="button" data-c="w">消えた軸（4 本目）</button>
            <button class="btn" type="button" data-c="arg">y の向き（偏角）</button>
            <button class="btn" type="button" data-c="abs">|y| の大きさ</button>
        </div>
        <div class="seg" id="looks" style="margin-top:8px">
            <button class="btn" type="button" data-l="neon">蛍光（光る半透明）</button>
            <button class="btn" type="button" data-l="solid">不透明</button>
        </div>
    </section>
    <section>
        <h3>表示</h3>
        <div class="seg" id="shows">
            <button class="btn" type="button" data-s="surf">曲面</button>
            <button class="btn" type="button" data-s="grid">格子</button>
            <button class="btn" type="button" data-s="floor">床</button>
            <button class="btn" type="button" data-s="axes">軸</button>
            <button class="btn" type="button" data-s="real">黄の線</button>
            <button class="btn" type="button" data-s="green">緑の線</button>
        </div>
        <div class="row"><button class="btn lime" id="infBtn" type="button" title="x の平面全体を円盤に、y の高さも縮めて、無限の遠くまで全部を 1 つの形に">∞ 無限まで見せる</button></div>
        <div class="row"><span id="rangeL">範囲</span><input type="range" id="range" min="0.5" max="12" step="0.1"><span class="v" id="rangeV"></span></div>
        <div class="row">歪み<input type="range" id="persp" min="0" max="1" step="0.01"><span class="v" id="perspV"></span></div>
    </section>
</aside>
<div class="legend" id="legend"></div>

<script>
(() => {
'use strict';

// ===== ここから下はグラフ電卓（graph.html）の式の読み取り・複素数の計算と同じ =====
// ==== PARSER START ====
// ---------- 数学関数 ----------
const FACT = [1];
for (let i = 1; i <= 170; i++) FACT[i] = FACT[i - 1] * i;

function gamma(z) {
    if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
    z -= 1;
    const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
        -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5050632385208166e-7];
    let x = c[0];
    for (let i = 1; i < 9; i++) x += c[i] / (z + i);
    const t = z + 7.5;
    return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}
function factorial(n) {
    if (Number.isInteger(n)) return n < 0 ? NaN : (n > 170 ? Infinity : FACT[n]);
    return gamma(n + 1);
}

const FUNCS = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan,
    sec: x => 1 / Math.cos(x), csc: x => 1 / Math.sin(x), cot: x => 1 / Math.tan(x),
    asin: Math.asin, acos: Math.acos, atan: Math.atan,
    arcsin: Math.asin, arccos: Math.acos, arctan: Math.atan,
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    asinh: Math.asinh, acosh: Math.acosh, atanh: Math.atanh,
    exp: Math.exp, ln: Math.log, log: Math.log10,
    sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs, sign: Math.sign,
    floor: Math.floor, ceil: Math.ceil, round: Math.round,
    max: Math.max, min: Math.min, gamma: gamma,
};
const VARIADIC = new Set(['max', 'min']);
const NAMES = [...Object.keys(FUNCS), 'sum', 'prod', 'pi'].sort((a, b) => b.length - a.length);
const UNI = { '×': '*', '·': '*', '∙': '*', '÷': '/', '−': '-', '–': '-' };

function ParseError(msg) { const e = new Error(msg); e.isParse = true; return e; }

// ---------- 字句解析 ----------
function tokenize(s) {
    const t = [];
    let i = 0;
    while (i < s.length) {
        let ch = s[i];
        if (/\s/.test(ch)) { i++; continue; }
        if (UNI[ch]) ch = UNI[ch];
        if (/[0-9.]/.test(ch)) {
            let j = i;
            while (j < s.length && /[0-9.]/.test(s[j])) j++;
            const raw = s.slice(i, j);
            if (!/^(\d+\.?\d*|\.\d+)$/.test(raw)) throw ParseError(`数の書き方が変です: ${raw}`);
            t.push({ k: 'num', v: parseFloat(raw), raw });
            i = j; continue;
        }
        if (ch === '²' || ch === '³') {
            t.push({ k: 'op', v: '^' }, { k: 'num', v: ch === '²' ? 2 : 3, raw: ch === '²' ? '2' : '3' });
            i++; continue;
        }
        if (ch === 'π') { t.push({ k: 'id', v: 'pi' }); i++; continue; }
        if (ch === 'Σ' || ch === '∑') { t.push({ k: 'fn', v: 'sum' }); i++; continue; }
        if (ch === 'Π' || ch === '∏') { t.push({ k: 'fn', v: 'prod' }); i++; continue; }
        if (ch === '√') { t.push({ k: 'fn', v: 'sqrt' }); i++; continue; }
        if (ch === '∛') { t.push({ k: 'fn', v: 'cbrt' }); i++; continue; }
        if (/[a-zA-Zα-ωΑ-Ω]/.test(ch)) {
            const low = s.slice(i, i + 8).toLowerCase();
            const m = NAMES.find(nm => low.startsWith(nm));
            if (m) {
                t.push(m === 'pi' ? { k: 'id', v: 'pi' } : { k: 'fn', v: m });
                i += m.length; continue;
            }
            const v = ch === 'X' ? 'x' : ch === 'Y' ? 'y' : ch;
            t.push({ k: 'id', v });
            i++;
            // ^ を打たない書き方：1 文字の変数のすぐ後の数字は指数（x2 → x²、a10 → a¹⁰）
            // e と i は除く（e2x・3i2 などが紛らわしいので、そのまま掛け算）。小数（x2.5）も除く。関数名は上で先に読むので関係しない
            if (v !== 'e' && v !== 'i' && /[0-9]/.test(s[i] || '')) {
                let j = i;
                while (j < s.length && /[0-9]/.test(s[j])) j++;
                if (s[j] !== '.') {
                    const raw = s.slice(i, j);
                    t.push({ k: 'op', v: '^' }, { k: 'num', v: parseFloat(raw), raw });
                    i = j;
                }
            }
            continue;
        }
        if ('+-*/^(),=!|'.includes(ch)) { t.push({ k: 'op', v: ch }); i++; continue; }
        throw ParseError(`使えない文字です: ${ch}`);
    }
    return t;
}

// ---------- 構文解析 ----------
function parse(src) {
    const toks = tokenize(src);
    let p = 0;
    const isOp = v => p < toks.length && toks[p].k === 'op' && toks[p].v === v;
    const expect = v => {
        if (!isOp(v)) {
            if (p >= toks.length) throw ParseError(`「${v}」が足りません`);
            throw ParseError(`「${v}」が必要な所に「${toks[p].v}」があります`);
        }
        p++;
    };
    const startsPrimary = () => {
        const tk = toks[p];
        return tk && (tk.k === 'num' || tk.k === 'id' || tk.k === 'fn' || (tk.k === 'op' && tk.v === '('));
    };

    function expr() {
        let l = term();
        while (isOp('+') || isOp('-')) {
            const op = toks[p++].v;
            l = { t: 'bin', op, l, r: term() };
        }
        return l;
    }
    function term() {
        let l = unary();
        for (;;) {
            if (isOp('*') || isOp('/')) {
                const op = toks[p++].v;
                l = { t: 'bin', op, l, r: unary() };
            } else if (startsPrimary()) {
                l = { t: 'bin', op: '*', l, r: power(), imp: true }; // 暗黙の掛け算
            } else break;
        }
        return l;
    }
    function unary() {
        if (isOp('-')) { p++; return { t: 'neg', a: unary() }; }
        if (isOp('+')) { p++; return unary(); }
        return power();
    }
    function power() {
        const b = postfix();
        if (isOp('^')) { p++; return { t: 'pow', b, e: unary() }; }
        return b;
    }
    function postfix() {
        let a = primary();
        while (isOp('!')) { p++; a = { t: 'fact', a }; }
        return a;
    }
    function primary() {
        const tk = toks[p];
        if (!tk) throw ParseError('式が途中で終わっています');
        if (tk.k === 'num') { p++; return { t: 'num', v: tk.v, raw: tk.raw }; }
        if (tk.k === 'id') { p++; return { t: 'var', name: tk.v }; }
        if (tk.k === 'op' && tk.v === '(') {
            p++;
            if (isOp(')')) throw ParseError('( ) の中が空です');
            const e = expr(); expect(')'); return e;
        }
        if (tk.k === 'op' && tk.v === '|') {
            p++; const e = expr(); expect('|');
            return { t: 'call', name: 'abs', args: [e] };
        }
        if (tk.k === 'fn') {
            p++;
            const name = tk.v;
            if (name === 'sum' || name === 'prod') {
                const sym = name === 'sum' ? 'Σ' : 'Π';
                expect('(');
                const vt = toks[p];
                if (!vt || vt.k !== 'id') throw ParseError(`${sym}( の後には変数を書きます（例: ${sym}(k=0,n, 式)）`);
                p++;
                if (isOp('=')) p++; else expect(',');
                if (isOp(',') || isOp(')')) throw ParseError(`${sym} の開始値が空です`);
                const from = expr(); expect(',');
                if (isOp(',') || isOp(')')) throw ParseError(`${sym} の終了値が空です`);
                const to = expr(); expect(',');
                if (isOp(')') || p >= toks.length) throw ParseError(`${sym} の中の式が空です`);
                const body = expr(); expect(')');
                return { t: 'sum', kind: name, v: vt.v, from, to, body };
            }
            if (isOp('(')) {
                p++;
                const args = [];
                if (!isOp(')')) {
                    args.push(expr());
                    while (isOp(',')) { p++; args.push(expr()); }
                }
                expect(')');
                if (VARIADIC.has(name) ? args.length < 1 : args.length !== 1)
                    throw ParseError(`${name} の引数の数が違います`);
                return { t: 'call', name, args };
            }
            if (VARIADIC.has(name)) throw ParseError(`${name}( ) と書いてください`);
            return { t: 'call', name, args: [power()] }; // sin x のような書き方
        }
        if (tk.k === 'op' && tk.v === ')') throw ParseError('「(」より「)」が多いか、( ) の中が空です');
        throw ParseError(`ここに「${tk.v}」は置けません`);
    }

    const ast = expr();
    if (p < toks.length) {
        const tk = toks[p];
        if (tk.v === ')') throw ParseError('「)」が多すぎます');
        throw ParseError(`「${tk.v}」の位置が変です`);
    }
    return ast;
}

// ---------- 関数へ変換 ----------
function compile(n) {
    switch (n.t) {
        case 'num': { const v = n.v; return () => v; }
        case 'var': {
            if (n.name === 'pi') return () => Math.PI;
            if (n.name === 'e') return () => Math.E;
            const nm = n.name;
            return env => env[nm];
        }
        case 'neg': { const a = compile(n.a); return env => -a(env); }
        case 'bin': {
            const l = compile(n.l), r = compile(n.r);
            switch (n.op) {
                case '+': return env => l(env) + r(env);
                case '-': return env => l(env) - r(env);
                case '*': return env => l(env) * r(env);
                case '/': return env => l(env) / r(env);
            }
            break;
        }
        case 'pow': { const b = compile(n.b), e = compile(n.e); return env => Math.pow(b(env), e(env)); }
        case 'fact': { const a = compile(n.a); return env => factorial(a(env)); }
        case 'call': {
            const f = FUNCS[n.name];
            const as = n.args.map(compile);
            if (as.length === 1) { const a = as[0]; return env => f(a(env)); }
            return env => f(...as.map(g => g(env)));
        }
        case 'sum': {
            const fr = compile(n.from), to = compile(n.to), body = compile(n.body);
            const v = n.v, isProd = n.kind === 'prod';
            return env => {
                const a = Math.ceil(fr(env) - 1e-9), b = Math.floor(to(env) + 1e-9);
                if (!isFinite(a) || !isFinite(b) || b - a > 100000) return NaN;
                const old = env[v];
                let s = isProd ? 1 : 0;
                for (let k = a; k <= b; k++) {
                    env[v] = k;
                    const t = body(env);
                    s = isProd ? s * t : s + t;
                }
                env[v] = old;
                return s;
            };
        }
    }
    throw ParseError('内部エラー');
}

// ---------- 自由な文字（x, y, i 以外はパラメータ） ----------
const RESERVED = new Set(['x', 'y', 'pi', 'e', 'i']);

    const from = { ...S.ang }, to = {};
    for (const k in ang) { const d = ((ang[k] - from[k]) % 360 + 540) % 360 - 180; to[k] = from[k] + d; }   // 近い方へ回る
    tween = { from, to, t0: performance.now(), dur: 1500, camFrom: camera.position.clone(), camTo: cam === 'top' ? CAM_TOP.clone() : (cam === 'side' && camera.position.y > 4.5 ? CAM_SIDE.clone() : null) };
    S.spinOn = false; syncUI();
    requestRender();
}
// ---------- グラフ電卓の中で：普通のグラフ ⇔ 4D に広がる・たたむ ----------
// 正面のカメラ：グラフ電卓のいまの表示（中心 cx, cy、横の半分 w）とぴったり同じ見え方
let unf = null, lastView = null;
function frontCam(v) {
    const Yr0 = S.yLock ? S.R : Yr;
    const T = new THREE.Vector3(v.cx / S.R, v.cy / Yr0, 0);
    const D = (v.w / S.R) / (Math.tan(camera.fov * Math.PI / 360) * camera.aspect);
    return { tgt: T, cam: T.clone().add(new THREE.Vector3(0, 0, D)) };
}
function startUnfold(v) {
    lastView = v;
    S.inf = false; S.yLock = true; S.yBlend = 0; S.yFix = 0;
    S.R = Math.max(0.5, Math.abs(v.cx) + v.w);
    S.ang = { xw: 0, yw: 0, zw: 0, xz: 0 }; S.spinOn = false; tween = null;
    S.grow = 0;
    rebuild(false, { noRoots: true });
    const f = frontCam(v);
    camera.position.copy(f.cam); controls.target.copy(f.tgt); camera.lookAt(f.tgt);
    unf = { dir: 1, t0: performance.now(), dur: 2800, camA: f.cam.clone(), tgtA: f.tgt.clone(), camB: CAM_SIDE.clone(), tgtB: new THREE.Vector3() };
    syncUI(); requestRender();
}
function startFold() {
    if (!lastView || !cur) { parent.postMessage({ type: 'folded' }, '*'); return; }
    S.spinOn = false; tween = null; S.inf = false;
    S.yFix = 0;
    if (!S.yLock) { S.yLock = true; S.yBlend = 1; S.R = Math.max(0.5, Math.abs(lastView.cx) + lastView.w); rebuild(false); }
    const f = frontCam(lastView);
    unf = { dir: -1, t0: performance.now(), dur: 2200, camA: camera.position.clone(), tgtA: controls.target.clone(), camB: f.cam, tgtB: f.tgt, angFrom: { ...S.ang } };
    syncUI();
}
function stepUnfold() {
    const u = Math.min(1, (performance.now() - unf.t0) / unf.dur);
    let uc, g;
    if (unf.dir > 0) { uc = ease(cl01(u / 0.45)); g = ease(cl01((u - 0.3) / 0.7)); }
    else {
        g = 1 - ease(cl01(u / 0.65)); uc = ease(cl01((u - 0.45) / 0.55));
        const ea = ease(cl01(u / 0.5));
        for (const k in unf.angFrom) { const d = ((0 - unf.angFrom[k]) % 360 + 540) % 360 - 180; S.ang[k] = unf.angFrom[k] + d * ea; }
        syncAngles();
    }
    camera.position.lerpVectors(unf.camA, unf.camB, uc);
    controls.target.lerpVectors(unf.tgtA, unf.tgtB, uc);
    camera.lookAt(controls.target);
    if (Math.abs(g - S.grow) > 0.004 || u >= 1) { S.grow = g; S.yBlend = g; rebuild(false, { noRoots: g < 0.999 }); }
    if (u >= 1) {
        const dir = unf.dir;
        unf = null;
        if (dir > 0) { S.grow = 1; S.yBlend = 1; rebuild(false); flashT = performance.now(); }
        else parent.postMessage({ type: 'folded' }, '*');
        save();
    }
}
function frame(t) {
    requestAnimationFrame(frame);
    const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0;
    lastT = t;
    let anim = false;
    if (S.spinOn && PLANES.some(p => S.spin[p.k])) {
        PLANES.forEach(p => { if (S.spin[p.k]) S.ang[p.k] = (S.ang[p.k] + 22 * p.rate * S.speed * dt) % 360; });
        anim = true;
        syncAngles();
    }
    if (tween) {
        const u = Math.min(1, (performance.now() - tween.t0) / tween.dur), e = ease(u);
        for (const k in tween.to) S.ang[k] = tween.from[k] + (tween.to[k] - tween.from[k]) * e;
        if (tween.camTo) camera.position.lerpVectors(tween.camFrom, tween.camTo, e), camera.lookAt(0, 0, 0);
        if (u >= 1) { for (const k in tween.to) S.ang[k] = ((tween.to[k] % 360) + 360) % 360; tween = null; flashT = performance.now(); save(); }
        syncAngles();
        anim = true;
    }
    if (unf) { stepUnfold(); anim = true; }
    let fl = 0;
    if (flashT) {
        const u = (performance.now() - flashT) / 1700;
        if (u >= 1) flashT = 0;
        else { fl = Math.pow(1 - u, 1.4) * (0.6 + 0.4 * Math.cos(u * Math.PI * 7)); anim = true; }
    }
    rootMat.uniforms.flash.value = fl;
    mats.green.uniforms.glow.value = fl;
    mats.real.uniforms.glow.value = fl;
    if (controls.update()) anim = true;
    if (anim || needRender) {
        updateRot();
        renderer.render(scene, camera);
        updateLabels();
        needRender = false;
    }
}

// ---------- UI ----------
function renderPlanes() {
    $('#planes').innerHTML = PLANES.map(p => `
        <div class="plane" data-k="${p.k}">
            <div class="nm">${p.name}<br><small>${p.sub}</small></div>
            <input type="range" min="0" max="360" step="1">
            <button class="btn" type="button" title="この面で回す">▶</button>
        </div>`).join('');
    document.querySelectorAll('.plane').forEach(el => {
        const k = el.dataset.k;
        el.querySelector('input').addEventListener('input', e => { tween = null; S.ang[k] = +e.target.value; requestRender(); saveSoon(); });
        el.querySelector('button').addEventListener('click', () => {
            S.spin[k] = !S.spin[k];
            if (S.spin[k]) S.spinOn = true;
            syncUI(); save();
        });
    });
}
function syncAngles() {
    document.querySelectorAll('.plane').forEach(el => {
        const inp = el.querySelector('input');
        if (document.activeElement !== inp) inp.value = Math.round(((S.ang[el.dataset.k] % 360) + 360) % 360);
    });
}
function renderViews() {
    $('#views').innerHTML = VIEWS.map(v => `<button class="btn" type="button" data-v="${v.k}">${v.name}<small>${v.sub}</small></button>`).join('');
    document.querySelectorAll('#views .btn').forEach(b => b.addEventListener('click', () => {
        const v = VIEWS.find(x => x.k === b.dataset.v);
        startTween(v.ang, v.cam);
    }));
}
function renderRootChips() {
    $('#rootCount').textContent = roots.length ? `${visRoots.length} 個` + (roots.length > visRoots.length ? `（範囲の外に ${roots.length - visRoots.length} 個。∞ で全部）` : '') : 'なし';
    $('#roots').innerHTML = visRoots.map((r, i) => `<span class="chip" data-i="${i}" title="${fmtC(r.re, r.im)}">${fmtR(r.re, r.im)}</span>`).join('');
    document.querySelectorAll('#roots .chip').forEach(c => c.addEventListener('click', () => {
        hotRoot = +c.dataset.i;
        rootMat.uniforms.hot.value = hotRoot;
        document.querySelectorAll('#roots .chip').forEach(x => x.classList.toggle('hot', x === c));
        flashT = performance.now();
        requestRender();
    }));
    hotRoot = -1; rootMat.uniforms.hot.value = -1;
}
function renderParams() {
    const names = cur ? cur.free : [];
    names.forEach(n => { if (!S.params[n]) S.params[n] = defaultParam(n); });
    $('#paramSec').hidden = !names.length;
    $('#params').innerHTML = names.map(n => {
        const p = S.params[n];
        return `<div class="param row" data-n="${n}"><i style="font:italic 500 14px 'Times New Roman',serif;color:var(--text)">${n}</i><input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.v}"><span class="v">${p.v}</span></div>`;
    }).join('');
    document.querySelectorAll('#params .param').forEach(el => el.querySelector('input').addEventListener('input', e => {
        const p = S.params[el.dataset.n];
        p.v = +e.target.value; el.querySelector('.v').textContent = p.v;
        scheduleRebuild(false); saveSoon(); writeHash();
    }));
}
function applyShow() {
    if (objs.surf) objs.surf.visible = S.show.surf;
    if (objs.grid) objs.grid.visible = S.show.grid && S.show.surf;
    if (objs.floor) objs.floor.visible = S.show.floor;
    if (objs.axes) objs.axes.visible = S.show.axes;
    if (objs.real) objs.real.visible = S.show.real;
    if (objs.green) objs.green.visible = S.show.green;
    const cm = { w: 0, arg: 1, abs: 2 }[S.color] || 0, neon = S.look !== 'solid';
    surfMats.solid.uniforms.cmode.value = surfMats.neon.uniforms.cmode.value = gridMat.uniforms.cmode.value = cm;
    gridMat.uniforms.neon.value = neon ? 1 : 0;
    if (objs.surf) objs.surf.material = surfMats[neon ? 'neon' : 'solid'];
    requestRender();
}
function syncUI() {
    PLANES.forEach(p => {
        const b = document.querySelector(`.plane[data-k="${p.k}"] button`);
        if (b) b.classList.toggle('on', S.spin[p.k]);
    });
    syncAngles();
    $('#spinAll').textContent = S.spinOn ? '止める' : '回す';
    $('#spinAll').classList.toggle('on', S.spinOn);
    $('#speed').value = S.speed; $('#speedV').textContent = S.speed.toFixed(2);
    $('#range').value = S.R; $('#rangeV').textContent = S.R.toFixed(1);
    $('#infBtn').classList.toggle('on', !!S.inf);
    $('#rangeL').textContent = S.inf ? '縮み方' : '範囲';
    $('#range').title = S.inf ? '|x| = この値の半分が、円盤の半径の半分の所に来る' : 'x の実部・虚部をこの値まで表示';
    $('#persp').value = S.pk; $('#perspV').textContent = S.pk.toFixed(2);
    document.querySelectorAll('#colors .btn').forEach(b => b.classList.toggle('on', b.dataset.c === S.color));
    document.querySelectorAll('#looks .btn').forEach(b => b.classList.toggle('on', b.dataset.l === (S.look === 'solid' ? 'solid' : 'neon')));
    document.querySelectorAll('#shows .btn').forEach(b => b.classList.toggle('on', !!S.show[b.dataset.s]));
    $('#legend').innerHTML = legendText();
    applyShow();
}
function legendText() {
    const c = S.color === 'w' ? (S.look === 'solid' ? '色＝いま消えている 4 本目の軸（<span style="color:#60a5fa">青−</span>・白0・<span style="color:#fb923c">橙+</span>）'
        : '色＝いま消えている 4 本目の軸（<span style="color:#22d3ee">シアン−</span>・<span style="color:#a3e635">ライム0</span>・<span style="color:#f472b6">マゼンタ+</span>）')
        : S.color === 'arg' ? '色＝y の向き（偏角、虹色が一周）、明るさの縞＝|y| が 2 倍ごと' : '色＝|y| の大きさ（暗いほど 0 に近い）';
    return `<i style="color:var(--rex)">Re x</i>・<i style="color:var(--imx)">Im x</i>・<i style="color:var(--rey)">Re y</i>・<i style="color:var(--imy)">Im y</i> の 4 本の軸を 4 次元のまま回し、4 本目の向きに回った軸は薄く消えます。　${c}　` +
        (S.inf ? '<b style="color:#d9f99d">∞ 無限まで：</b>床（x の平面全体）を円盤に縮め、円盤の縁が無限の遠く。高さも |y| を縮めて、どこまで大きくても有限に。　' : '') +
        `<span style="color:#fde047">黄＝x が実数</span>　<span style="color:#4ade80">緑＝y が実数</span>　<span style="color:var(--lime)">●＝解（y = 0）</span>`;
}

let rebuildQueued = null;
function scheduleRebuild(fitR) {
    if (rebuildQueued) return;
    rebuildQueued = requestAnimationFrame(() => { rebuildQueued = null; rebuild(fitR); });
}
function setExpr(text, fitR = true) {
    S.expr = text;
    try {
        cur = analyzeExpr(text);
        $('#err').hidden = true;
    } catch (e) {
        $('#err').hidden = false; $('#err').textContent = e.isParse ? e.message : '式を読み取れません';
        return;
    }
    renderParams();
    rebuild(fitR);
    save(); writeHash();
}
function writeHash() {
    if (EMBED) return;
    const used = {};
    (cur ? cur.free : []).forEach(n => { used[n] = S.params[n]; });
    const h = 'e=' + encodeURIComponent(S.expr) + (Object.keys(used).length ? '&p=' + encodeURIComponent(JSON.stringify(used)) : '');
    try { history.replaceState(null, '', '#' + h); } catch (_) { /* file:// などでは何もしない */ }
}
function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (!h.get('e')) return false;
    S.expr = h.get('e');
    try { const p = JSON.parse(h.get('p') || '{}'); for (const k in p) if (p[k] && isFinite(p[k].v)) S.params[k] = p[k]; } catch (_) { /* 無視 */ }
    return true;
}
function loadPreset(p) {
    S.params = { ...S.params, ...(p.params || {}) };
    for (const k in S.spin) S.spin[k] = (p.spin || []).includes(k);
    S.spinOn = true;
    S.ang = { xw: 0, yw: 0, zw: 0, xz: 0, ...(p.ang || {}) };
    S.inf = !!p.inf;
    S.yFix = p.yFix || 0;   // 高さの縮尺を固定する例（e^(ix) のように虚軸の向きに急に大きくなる式で、らせんが小さくならないように）
    $('#expr').value = p.e;
    if (p.R) { S.R = p.R; setExpr(p.e, false); } else setExpr(p.e, true);
    syncUI();
}

// 入力・ボタン
PRESETS.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.name; $('#preset').appendChild(o); });
$('#preset').addEventListener('change', e => { const i = e.target.value; e.target.value = ''; if (i !== '') loadPreset(PRESETS[+i]); });
let exprTimer = null;
$('#expr').addEventListener('input', e => { clearTimeout(exprTimer); exprTimer = setTimeout(() => setExpr(e.target.value, true), 350); });
$('#spinAll').addEventListener('click', () => { S.spinOn = !S.spinOn; tween = null; syncUI(); save(); });
$('#speed').addEventListener('input', e => { S.speed = +e.target.value; $('#speedV').textContent = S.speed.toFixed(2); saveSoon(); });
$('#range').addEventListener('input', e => { S.R = +e.target.value; $('#rangeV').textContent = S.R.toFixed(1); scheduleRebuild(false); saveSoon(); });
$('#persp').addEventListener('input', e => { S.pk = +e.target.value; $('#perspV').textContent = S.pk.toFixed(2); requestRender(); saveSoon(); });
$('#fitRoots').addEventListener('click', () => rebuild(true));
$('#infBtn').addEventListener('click', () => { S.inf = !S.inf; rebuild(true); syncUI(); save(); });
document.querySelectorAll('#colors .btn').forEach(b => b.addEventListener('click', () => { S.color = b.dataset.c; syncUI(); save(); }));
document.querySelectorAll('#looks .btn').forEach(b => b.addEventListener('click', () => { S.look = b.dataset.l; syncUI(); save(); }));
document.querySelectorAll('#shows .btn').forEach(b => b.addEventListener('click', () => { S.show[b.dataset.s] = !S.show[b.dataset.s]; syncUI(); save(); }));
$('#panelBtn').addEventListener('click', () => { $('#panel').hidden = !$('#panel').hidden; });
if (window.innerWidth <= 760) $('#panel').hidden = true;

// ---------- 開始 ----------
renderPlanes();
renderViews();
if (EMBED) {
    // グラフ電卓から式が届くのを待つ
    load();
    S.grow = 1;
    $('#panel').hidden = true;
    resize(); syncUI();
    window.addEventListener('message', e => {
        if (e.source !== window.parent) return;
        const m = e.data || {};
        if (m.type === 'set') {
            if (m.params) for (const k in m.params) S.params[k] = { ...m.params[k] };
            if (m.expr !== S.expr || !cur) {
                S.expr = m.expr;
                try { cur = analyzeExpr(m.expr); $('#err').hidden = true; }
                catch (er) { $('#err').hidden = false; $('#err').textContent = er.isParse ? er.message : '式を読み取れません'; return; }
            }
            $('#popout').href = 'graph4d.html#e=' + encodeURIComponent(S.expr);
            if (m.unfold && m.view) { startUnfold(m.view); return; }
            if (!unf) scheduleRebuild(false);
        } else if (m.type === 'fold') startFold();
    });
    parent.postMessage({ type: 'ready' }, '*');
    requestAnimationFrame(frame);
    return;
}
const fromHash = readHash();
if (!fromHash) load();
S.grow = 1; S.yLock = false;
resize();
syncUI();
$('#expr').value = S.expr;
if (fromHash) {
    // グラフ電卓から来た時：解が全部入る範囲にして、少し回す
    S.spin = { xw: false, yw: false, zw: true, xz: false }; S.spinOn = true; S.ang = { xw: 0, yw: 0, zw: 0, xz: 0 };
    setExpr(S.expr, true); syncUI();
} else if (!localStorage.getItem(STORE)) loadPreset(PRESETS[0]);
else setExpr(S.expr, false);
window.addEventListener('hashchange', () => { if (readHash()) { $('#expr').value = S.expr; setExpr(S.expr, true); } });
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
