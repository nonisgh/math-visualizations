<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>5次元球（S⁴）｜次元おりがみ UI</title>
    <!-- アプリのアイコン（Dock・ホーム画面・タブ）とアプリ名。Safari の「Dockに追加」「ホーム画面に追加」で使われる -->
    <link rel="icon" type="image/svg+xml" href="icons/hypersphere5d.svg">
    <link rel="apple-touch-icon" href="icons/hypersphere5d-180.png">
    <link rel="manifest" href="icons/hypersphere5d.webmanifest">
    <meta name="apple-mobile-web-app-title" content="5D超球">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#030712">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.93); border: 1px solid rgba(255, 255, 255, 0.12); }
        /* サイドパネル（--sb-w：パネル幅、--sb：描画領域から引く幅。パネルを閉じると 0）＝次元おりがみと同じ */
        body { --sb-w: 340px; --sb: var(--sb-w); --dock-l: 0px; --dock-r: 0px; }
        body.sidebar-hidden { --sb: 0px; }
        body.dock-left-on { --dock-l: min(340px, 32vw); }
        body.dock-right-on { --dock-r: min(340px, 32vw); }
        body.sidebar-hidden #ui-overlay { display: none; }
        #sidebar-open { display: none; }
        body.sidebar-hidden #sidebar-open { display: flex; }
        #main-container { position: absolute; top: 0; bottom: 0; right: var(--dock-r); left: calc(var(--sb) + var(--dock-l)); }
        #rot-bar { left: calc(var(--sb) + var(--dock-l) + 12px); right: calc(var(--dock-r) + 12px); }
        #ui-overlay { left: 0; right: auto; border-width: 0 1px 0 0 !important; }
        #sidebar-open { left: 12px; }
        .sb-sec { background: rgba(2, 6, 23, 0.35); border: 1px solid rgba(51, 65, 85, 0.6); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .sb-h { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #cbd5e1; margin: 0; }
        /* ポップアップ分離：欄を切り離して浮かせる */
        #float-layer { position: fixed; inset: 0; z-index: 45; pointer-events: none; }
        .float-panel { position: absolute; width: min(330px, 92vw); max-height: 82vh; overflow-y: auto; overflow-x: hidden; pointer-events: auto; border-radius: 12px; box-shadow: 0 12px 44px rgba(0, 0, 0, 0.6); }
        .float-panel > .sb-sec { margin: 0; padding-top: 0; background: rgba(4, 8, 22, 0.96); border-color: rgba(129, 140, 248, 0.55); }   /* 背景ぼかしは外した（ほぼ不透明なので見た目は同じ・3Dが動くたびのぼかし計算をなくして軽く） */
        .float-panel .sb-h { cursor: move; position: sticky; top: 0; z-index: 5; margin: 0 -10px; padding: 9px 10px 7px; background: rgba(7, 11, 26, 0.98); box-shadow: 0 1px 0 rgba(129, 140, 248, 0.3); }
        .sb-floatbtn { margin-left: 6px; flex-shrink: 0; font-size: 10px; font-weight: 400; color: #8aa0c6; cursor: pointer; white-space: nowrap; background: none; border: 0; padding: 0 2px; }
        .sb-floatbtn:hover { color: #e2e8f0; }
        .sb-sec.floating > .sb-h .sb-floatbtn { color: #a5b4fc; }
        /* 説明文：ふだんはたたんで「📖 [説明]」だけ。押すと開く */
        .expl-tg { display: inline-flex; align-items: center; gap: 3px; align-self: flex-start; font-size: 10px; line-height: 1.4; color: #8aa0c6; background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
        .expl-tg:hover { color: #e2e8f0; }
        .expl-tg .expl-ic { flex-shrink: 0; transition: transform .15s; }
        .expl-tg:hover .expl-ic { transform: translateY(-1px); }
        .expl-closed { display: none !important; }
        /* 画面端にドッキングした2ペイン用のレール（幅は --dock-l/--dock-r と連動＝描画領域が自動で縮む） */
        .dock-rail { position: fixed; top: 0; bottom: 0; z-index: 44; width: 0; overflow: hidden; pointer-events: none; display: flex; flex-direction: column; gap: 8px; padding: 0; box-sizing: border-box; background: rgba(2, 5, 16, 0.95); }
        .dock-rail.active { pointer-events: auto; overflow-y: auto; overflow-x: hidden; padding: 8px; }
        #dock-left { left: 0; width: var(--dock-l); border-right: 1px solid rgba(129, 140, 248, 0.4); }
        #dock-right { right: 0; width: var(--dock-r); border-left: 1px solid rgba(129, 140, 248, 0.4); }
        body.sidebar-left:not(.sidebar-hidden) #dock-left { left: var(--sb); }
        body:not(.sidebar-left):not(.sidebar-hidden) #dock-right { right: var(--sb); }
        /* メニューを非表示にしたら、端にくっつけた（ドックした）パネルも一緒に隠して描画領域を広げる。浮いているパネルは出したまま */
        body.sidebar-hidden #dock-left, body.sidebar-hidden #dock-right { display: none; }
        body.sidebar-hidden.dock-left-on { --dock-l: 0px; }
        body.sidebar-hidden.dock-right-on { --dock-r: 0px; }
        .float-panel.docked { position: static !important; width: 100% !important; max-height: none !important; left: auto !important; top: auto !important; box-shadow: none; flex: 0 0 auto; overflow: visible; }   /* スクロールは入れ物（グループ・レール）側で。見出しの固定もそこ基準 */
        /* 分離パネルの連結（Photoshop 風）：浮いているグループ＝縦に連結したパネルの入れ物。2枚以上で「まとめて移動」のつまみ */
        .float-stack { position: absolute; width: min(330px, 92vw); max-height: 82vh; overflow-y: auto; overflow-x: hidden; pointer-events: auto; border-radius: 12px; box-shadow: 0 12px 44px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; gap: 6px; }
        .float-stack > .fs-grip { display: none; }
        .float-stack.multi { background: rgba(4, 8, 22, 0.55); border: 1px solid rgba(129, 140, 248, 0.35); padding: 0 4px 4px; }
        .float-stack.multi > .fs-grip { display: flex; align-items: center; gap: 6px; position: sticky; top: 0; z-index: 6; height: 24px; flex: 0 0 auto; box-sizing: border-box; cursor: move; user-select: none; font-size: 10px; color: #a5b4fc; padding: 0 8px; margin: 0 -4px; background: rgba(30, 27, 75, 0.96); border-bottom: 1px solid rgba(129, 140, 248, 0.35); }
        .float-stack.multi .float-panel .sb-h { top: 24px; }
        .fs-grip .fs-dots { font-size: 13px; letter-spacing: -1px; }
        .fs-grip .fs-fold { margin-left: auto; }
        .float-stack.joining { opacity: 0.55; }
        .float-stack.collapsed > .float-panel { display: none; }   /* まとめてたたむ：つまみだけ残す */
        .float-stack.collapsed { padding-bottom: 0; }
        .float-stack.collapsed > .fs-grip { margin-bottom: 0; border-bottom: 0; border-radius: 11px; }
        .fs-grip .fs-count { color: #8aa0c6; }
        .sb-panel > .sb-sec[data-fid] > .sb-h, .sb-h.xp-drag { cursor: grab; user-select: none; }   /* メニューの欄も見出しをつかんでドラッグで分離 */
        .sb-panel > .sb-sec[data-fid] > .sb-h button, .sb-h.xp-drag button { cursor: pointer; }
        /* タブでまとめる：見出しの代わりにタブ。選んだ1枚だけ表示 */
        .float-stack.tabbed > .float-panel:not(.tab-on) { display: none; }
        .float-stack.tabbed > .float-panel > .sb-sec > .sb-h { display: none; }
        .float-stack.tabbed > .float-panel > .sb-sec { padding-top: 10px; border-top-left-radius: 0; border-top-right-radius: 0; }
        .float-stack.tabbed { gap: 0; }
        .float-stack > .fs-tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 3px; position: sticky; top: 24px; z-index: 6; margin: 4px -4px 0; padding: 4px 6px 0; background: rgba(7, 11, 26, 0.98); border-bottom: 1px solid rgba(167, 139, 250, 0.55); }
        .float-stack.collapsed > .fs-tabs { display: none; }
        .fs-tab { font-size: 11px; line-height: 1.2; padding: 5px 10px; border-radius: 7px 7px 0 0; color: #94a3b8; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(71, 85, 105, 0.7); border-bottom: 0; cursor: pointer; user-select: none; touch-action: none; }
        .fs-tab:hover { color: #e2e8f0; }
        .fs-tab.on { color: #ede9fe; background: rgba(76, 29, 149, 0.6); border-color: rgba(167, 139, 250, 0.75); }
        .fs-tabs .fs-tab-back { margin-left: auto; align-self: center; }
        #dock-ins { position: fixed; z-index: 47; height: 4px; border-radius: 2px; background: #a5b4fc; box-shadow: 0 0 10px rgba(165, 180, 252, 0.9); pointer-events: none; display: none; }
        #dock-hint { position: fixed; top: 0; bottom: 0; z-index: 46; pointer-events: none; display: none; background: rgba(129, 140, 248, 0.16); border: 2px dashed rgba(129, 140, 248, 0.75); border-radius: 10px; box-sizing: border-box; }
        .ios-sw { position: relative; display: inline-block; width: 30px; height: 16px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; box-sizing: border-box; transition: background .2s, border-color .2s; flex-shrink: 0; margin-left: 7px; vertical-align: middle; }
        .ios-sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 8px; height: 8px; background: #64748b; transform: rotate(45deg); transition: left .2s, background .2s; }
        .ios-sw.on { border-color: #a855f7; background: #3b1d5c; }
        .ios-sw.on::after { left: 17px; background: #e9d5ff; }
        button.has-sw { display: inline-flex; align-items: center; }
        /* 回転面の行：面の名前（2軸の色）・スライダー・角度・自動のスイッチ */
        .pl-row { display: grid; grid-template-columns: 44px 1fr 40px auto; align-items: center; gap: 6px; font-size: 11px; }
        .pl-name { font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
        .pl-deg { text-align: right; font-family: ui-monospace, Menlo, monospace; color: #94a3b8; font-size: 10px; }
        .pl-row button { padding: 1px 6px; border-radius: 7px; border: 1px solid #334155; background: rgba(30, 41, 59, 0.8); color: #cbd5e1; font-size: 10px; }
        .sl-row { display: grid; grid-template-columns: 70px 1fr 38px; align-items: center; gap: 6px; font-size: 11px; color: #cbd5e1; }
        .sl-row output { text-align: right; font-family: ui-monospace, Menlo, monospace; color: #94a3b8; font-size: 10px; }
        input[type=range] { accent-color: #a855f7; width: 100%; }
        .tbtn { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 9px; border: 1px solid #334155; background: rgba(30, 41, 59, 0.8); color: #cbd5e1; font-size: 11px; white-space: nowrap; }
        .tbtn:hover { background: #334155; }
        .tbtn.on { background: rgba(124, 58, 237, 0.35); border-color: rgba(167, 139, 250, 0.7); color: #ede9fe; }
        #angles { font-family: ui-monospace, Menlo, monospace; }
    </style>
</head>
<body class="w-full h-screen relative select-none overflow-hidden sidebar-left">
    <div id="main-container">
        <div id="view" class="absolute inset-0"></div>
        <div id="badge" class="absolute top-4 left-4 pointer-events-none bg-slate-900/85 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-bold text-amber-300 shadow-lg flex items-center gap-2 z-10">
            <i data-lucide="globe" class="w-4 h-4"></i>
            <div><div>5次元球（S⁴）→ 3D</div><div class="text-[10px] font-normal text-slate-400">x²+y²+z²+w²+v²＝R²。v と w の2段の遠近で 3D に写す</div></div>
        </div>
        <div id="angles" class="absolute top-4 right-4 pointer-events-none bg-slate-900/85 border border-slate-700 rounded-xl px-2.5 py-1.5 text-[10px] leading-snug z-10"></div>
        <div id="fps" class="absolute bottom-4 right-4 pointer-events-none text-[10px] text-slate-500 font-mono z-10"></div>
    </div>

    <div id="rot-bar" class="absolute bottom-3 z-30 pointer-events-none flex justify-center">
        <div class="glass-panel rounded-xl px-2.5 py-1.5 pointer-events-auto shadow-xl flex items-center gap-1.5 text-[11px] flex-wrap justify-center">
            <span class="text-violet-200 font-bold flex items-center gap-1 shrink-0 mr-0.5"><i data-lucide="orbit" class="w-3.5 h-3.5"></i>回転</span>
            <button class="tbtn" data-preset="all" title="7面すべてを自動で回す">全部</button>
            <button class="tbtn" data-preset="w" title="w が絡む3面（X-W・Y-W・Z-W）">W系</button>
            <button class="tbtn" data-preset="v" title="v が絡む3面（X-V・Y-V・Z-V）">V系</button>
            <button class="tbtn" data-preset="dbl" title="X-W と Y-V を同時に＝5次元ならではの「ダブル回転」（2つの面が互いに独立）">ダブル回転</button>
            <button class="tbtn" data-preset="stop" title="自動回転を止める（角度はそのまま）">停止</button>
            <button class="tbtn" data-preset="reset" title="角度を全部0に戻して止める">リセット</button>
        </div>
    </div>

    <button id="sidebar-open" class="absolute top-3 z-30 items-center gap-1 px-2 py-1 rounded-lg glass-panel text-[11px] text-slate-300" title="パネルを開く"><i data-lucide="panel-left-open" class="w-3.5 h-3.5"></i>パネル</button>

    <aside id="ui-overlay" class="absolute top-0 h-full z-30 glass-panel flex flex-col pointer-events-auto" style="width: var(--sb-w);">
        <div class="flex items-center justify-between px-3 pt-2.5 pb-2 border-b border-slate-800">
            <span class="text-[12px] font-bold text-slate-200 flex items-center gap-1.5"><i data-lucide="globe" class="w-4 h-4 text-amber-300"></i>5次元球（S⁴）</span>
            <button id="sidebar-close" class="text-slate-400 hover:text-slate-200 px-1.5 py-0.5 rounded hover:bg-slate-800 text-[11px] flex items-center gap-1" title="パネルを閉じて図形を広く"><i data-lucide="panel-left-close" class="w-3.5 h-3.5"></i>閉じる</button>
        </div>
        <div class="flex-1 overflow-y-auto px-3 py-2.5">
            <div class="sb-panel space-y-3">
                <section class="sb-sec">
                    <h3 class="sb-h"><i data-lucide="rotate-3d" class="w-3.5 h-3.5"></i>回転（7つの面）</h3>
                    <div id="pl-rows" class="flex flex-col gap-1.5"></div>
                    <p class="text-[10px] text-slate-500 leading-snug">スライダーで角度、右のスイッチで自動回転。w・v が絡む面を回すと、殻が入れ替わりながら裏返るように見えます。</p>
                </section>
                <section class="sb-sec">
                    <h3 class="sb-h"><i data-lucide="gauge" class="w-3.5 h-3.5"></i>自動回転</h3>
                    <div class="sl-row"><span>速さ</span><input id="spd" type="range" min="0.2" max="3" step="0.1" value="1"><output id="spdO"></output></div>
                    <div class="flex flex-wrap gap-1.5">
                        <button class="tbtn" data-preset="all">全部</button><button class="tbtn" data-preset="w">W系</button><button class="tbtn" data-preset="v">V系</button><button class="tbtn" data-preset="dbl">ダブル回転</button><button class="tbtn" data-preset="stop">停止</button><button class="tbtn" data-preset="reset">リセット</button>
                    </div>
                </section>
                <section class="sb-sec">
                    <h3 class="sb-h"><i data-lucide="eye" class="w-3.5 h-3.5"></i>見え方</h3>
                    <div class="sl-row"><span>遠近 V</span><input id="cv" type="range" min="2.5" max="8" step="0.1" value="4.5"><output id="cvO"></output></div>
                    <div class="sl-row"><span>遠近 W</span><input id="cw" type="range" min="2.5" max="8" step="0.1" value="4.5"><output id="cwO"></output></div>
                    <div class="sl-row"><span>線の濃さ</span><input id="op" type="range" min="0.1" max="1" step="0.05" value="0.5"><output id="opO"></output></div>
                    <div class="flex flex-wrap gap-1.5">
                        <button id="ax-btn" class="tbtn"><span id="ax-text">軸の点: ON</span></button>
                        <button id="color-btn" class="tbtn"><span id="color-text">色を v で: ON</span></button>
                    </div>
                    <p class="text-[10px] text-slate-500 leading-snug">点：赤 x・緑 y・青 z・紫 w・琥珀 v（暗いほうが −側）。殻の色は、OFF だと w の位置で塗り分けます。</p>
                </section>
                <section class="sb-sec">
                    <h3 class="sb-h"><i data-lucide="layers" class="w-3.5 h-3.5"></i>殻の数</h3>
                    <div class="sl-row"><span>v の層</span><input id="nv" type="range" min="3" max="31" step="1" value="7"><output id="nvO"></output></div>
                    <div class="sl-row"><span>w の層</span><input id="nw" type="range" min="3" max="31" step="1" value="9"><output id="nwO"></output></div>
                    <p class="text-[10px] text-slate-500 leading-snug">5次元球を v と w で輪切りにすると、1枚1枚は 3D の球（殻）になります。層を増やすほど細かく、ただし重く。</p>
                </section>
            </div>
        </div>
    </aside>

<script>
// ===== 5次元球 S⁴（もとの hypersphere5d.html と同じ中身。UI だけ次元おりがみ風に） =====
// 殻のパラメータ：ψ（v＝R·cosψ）と θ（w＝R·sinψ·cosθ）。各 (ψ,θ) で半径 ρ＝R·sinψ·sinθ の 3D 球殻（xyz）になる。
const R = 1.3, SC = 1.4, TAU = Math.PI * 2;
let N = 9, M = 7;   // w の層・v の層の数
const AXC_HEX = { x: '#ff5d6c', y: '#3ddc84', z: '#56a8ff', w: '#b07cff', v: '#fbbf24' };   // 軸の色（次元おりがみと同じ）
const PL = [['X-W', 0, 3], ['Y-W', 1, 3], ['Z-W', 2, 3], ['X-V', 0, 4], ['Y-V', 1, 4], ['Z-V', 2, 4], ['W-V', 3, 4]];
const AX = ['x', 'y', 'z', 'w', 'v'];
const RATE = [1, 0.77, 0.61, 0.53, 0.43, 0.37, 0.29];   // 面ごとの速さの比（同じ姿勢に戻りにくく）
const ang = PL.map(() => 0), auto = PL.map(() => false);
let spd = 1, camV = 4.5, camW = 4.5, op = 0.5, showAx = true, colorByV = true;
const $ = id => document.getElementById(id);
const deg = a => (a * 180 / Math.PI).toFixed(0) + '°';
const norm = a => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };

// ---- three.js ----
const view = $('view'), scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100); cam.position.set(0, 0, 7.5);
const ren = new THREE.WebGLRenderer({ antialias: true, alpha: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2)); view.appendChild(ren.domElement);
const ctl = new THREE.OrbitControls(cam, ren.domElement); ctl.enableDamping = true; ctl.dampingFactor = 0.06;
function onWindowResize() { const w = view.clientWidth, h = view.clientHeight; if (!w || !h) return; ren.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', onWindowResize);
if (window.ResizeObserver) new ResizeObserver(onWindowResize).observe(view);   // パネルを閉じる・端にドックで描画領域が変わったとき
function requestRender() {}   // 毎フレーム描くので何もしない（パネル部品との互換用）
let _zfKick = 0;              // 同上（自動ズームは無し）

// ---- 殻 ----
const shells = [];
function shellColor(psi, th) { return colorByV ? new THREE.Color().setHSL(0.85 * psi / Math.PI, 0.9, 0.45 + 0.2 * Math.sin(th)) : new THREE.Color().setHSL(0.72 - 0.6 * th / Math.PI, 0.85, 0.5 + 0.12 * Math.sin(psi)); }
function applyOp() { const e = Math.max(0.06, op * Math.min(1, Math.sqrt(60 / (N * M)))); shells.forEach(S => S.mesh.material.opacity = e); }   // 殻が多いほど1枚を薄く
function applyColors() { shells.forEach(S => S.mesh.material.color.copy(shellColor(S.psi, S.th))); }
function build() {
    while (shells.length) { const S = shells.pop(); scene.remove(S.mesh); S.geo.dispose(); S.mesh.material.dispose(); }
    const tot = N * M, sw = tot > 400 ? 8 : tot > 200 ? 10 : tot > 100 ? 12 : 14, sh = tot > 400 ? 5 : tot > 200 ? 6 : tot > 100 ? 8 : 9;   // 殻が多いときは分割を粗く＝軽く
    for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) {
        const psi = (j + 0.5) / M * Math.PI, th = (i + 0.5) / N * Math.PI;
        const rho = R * Math.sin(psi) * Math.sin(th), w = R * Math.sin(psi) * Math.cos(th), v = R * Math.cos(psi);
        const geo = new THREE.SphereGeometry(1, sw, sh), base = Float32Array.from(geo.attributes.position.array);

                function armDrag(e, onStart) {   // 少し（4px）動かしたらドラッグ開始。動かさなければふつうのクリック
                    const sx = e.clientX, sy = e.clientY;
                    const off = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', off); window.removeEventListener('pointercancel', off); };
                    const mv = ev => { if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 4) { off(); onStart(ev); } };
                    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', off); window.addEventListener('pointercancel', off);
                }
                function beginDrag(sec, ev) {   // 浮いている欄を動かす。1枚だけのグループならグループごと、連結中・タブ中・ドック中なら1枚だけ抜き出す
                    const wrap = sec._fwrap; if (!wrap) return;
                    let st = wrap.parentNode;
                    if (isRail(st) || wrapsIn(st).length > 1) {
                        const from = st, wasTab = from.classList && from.classList.contains('tabbed');
                        const r = (wasTab ? from : wrap).getBoundingClientRect();   // タブから抜くときは、グループの位置から
                        st = newStack(r.left, r.top); insertWrap(wrap, st, 0); wrap.classList.remove('tab-on'); tidy(from); tidy(st);
                        st.style.left = clampX(ev.clientX - 60, st) + 'px'; st.style.top = clampY(ev.clientY - 14) + 'px';   // つかんだ所の近くに見出しが来るように
                    }
                    dragStack(st, ev, true);
                }
                function detachAt(wrap, ev) {   // メニューから直接ドラッグ：切り離して、つかんだ位置のまま浮かせて動かし始める
                    const st = newStack(ev.clientX - 60, ev.clientY - 14); insertWrap(wrap, st, 0); tidy(st);
                    st.style.left = clampX(ev.clientX - 60, st) + 'px'; st.style.top = clampY(ev.clientY - 14) + 'px';
                    dragStack(st, ev, true);
                }
                const NODRAG = 'button, input, select, textarea, label, a';
                function makeDrag(sec) {   // 見出しをつかんで動かす。メニューの中の欄も、マウス・ペンなら見出しをドラッグでそのまま分離
                    const handle = sec.querySelector(':scope > .sb-h');
                    handle.addEventListener('pointerdown', e => {
                        sec._moved = false;
                        if (e.button !== 0 || e.target.closest(NODRAG)) return;
                        const floating = sec.classList.contains('floating');
                        if (!floating && e.pointerType === 'touch') return;   // タッチはメニューのスクロールと区別できないので「分離」ボタンで
                        if (e.pointerType !== 'touch') e.preventDefault();   // 文字の選択を始めない
                        armDrag(e, ev => {
                            sec._moved = true;
                            if (sec.classList.contains('floating')) beginDrag(sec, ev);
                            else detachAt(prepSec(sec), ev);
                        });
                    });
                    handle.addEventListener('click', e => { if (sec._moved && !e.target.closest(NODRAG)) { e.stopPropagation(); e.preventDefault(); } sec._moved = false; }, true);   // ドラッグ直後の見出しクリック（たたむ等）だけ抑制。ボタンは通す
                }
                function makeWrap(sec) {   // パネルの枠（グループやレールに入る1枚）
                    const wrap = document.createElement('div'); wrap.className = 'float-panel docked';
                    wrap.appendChild(sec); wrap._sec = sec;
                    sec.classList.add('floating'); sec._fwrap = wrap; sec._dockSide = null;
                    return wrap;
                }
                function defaultPos() { const p = { x: Math.round(window.innerWidth * 0.42) + (cascade % 3) * 22, y: 70 + (cascade % 6) * 28 }; cascade++; return p; }
                function prepSec(sec) {   // ふつうの欄を切り離して枠に入れる（置き場所はまだ）
                    if (sec.classList.contains('floating')) return sec._fwrap;
                    homes.set(sec, { parent: sec.parentNode, next: sec.nextSibling });
                    const w = makeWrap(sec); sec._fbtn.textContent = '⇲ 戻す'; return w;
                }
                function floatSec(sec) {   // 「分離」：新しい1枚グループとして浮かせる
                    if (sec.classList.contains('floating')) return;
                    const w = prepSec(sec), p = defaultPos(), st = newStack(p.x, p.y);
                    insertWrap(w, st, 0); tidy(st); save();
                }
                function dockSec(sec) {   // 「戻す」＝元の場所へ（浮き・連結・ドックどこからでも）
                    const home = homes.get(sec); if (!home) return;
                    const wrap = sec._fwrap, c = wrap ? wrap.parentNode : null;
                    sec._dockSide = null; sec.classList.remove('floating'); sec._fbtn.textContent = '⇱ 分離';
                    home.parent.insertBefore(sec, home.next); if (wrap) wrap.remove(); sec._fwrap = null; homes.delete(sec);
                    tidy(c); save();
                }
                const homeOf = sec => () => dockSec(sec);
                // 各タブの各欄にボタンを付ける（共有の「分解」欄は特殊なので除く）
                const secById = new Map();
                document.querySelectorAll('.sb-panel').forEach(panel => {
                    [...panel.children].forEach(sec => {
                        if (sec.tagName !== 'SECTION' || !sec.classList.contains('sb-sec')) return;
                        const h = sec.querySelector(':scope > .sb-h'); if (!h) return;
                        const title = titleOf(h); if (!title) return;
                        sec.dataset.fid = title; secById.set(title, sec);
                        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'sb-floatbtn';
                        btn.textContent = '⇱ 分離'; btn.title = 'この欄を切り離して浮かせる（見出しをドラッグしても分離できます。ほかのパネルに重ねると連結・間に差し込み。端に寄せるとドック。「戻す」で元の場所へ）';
                        btn.addEventListener('click', e => { e.stopPropagation(); if (sec.classList.contains('floating')) dockSec(sec); else floatSec(sec); });
                        h.appendChild(btn); sec._fbtn = btn; makeDrag(sec);
                    });
                });
                // 保存されていた並びを復元（昔の形式は、1枚ずつのグループ／レールへ読み替え）
                (function restore() {
                    let L = layout0 || {};
                    if (L.v !== 2) {
                        const o = L; L = { v: 2, stacks: [], left: [], right: [] };
                        Object.keys(o).forEach(fid => { const s = o[fid]; if (!s || typeof s !== 'object') return; if (s.dock === 'left' || s.dock === 'right') L[s.dock].push(fid); else L.stacks.push({ x: s.x, y: s.y, ids: [fid] }); });
                    }
                    const prep = fid => secById.has(fid) ? prepSec(secById.get(fid)) : null;
                    const used = new Set();
                    const fill = (c, ids) => (ids || []).forEach(fid => { if (used.has(fid)) return; const w = prep(fid); if (w) { used.add(fid); insertWrap(w, c, wrapsIn(c).length); } });
                    restoring = true;
                    const wide = window.innerWidth >= DOCK_MINW;
                    ['left', 'right'].forEach(side => {
                        const ids = L[side] || []; if (!ids.length) return;
                        if (wide) { const rail = side === 'left' ? railL : railR; fill(rail, ids); tidy(rail); }
                        else { const p = defaultPos(), st = newStack(p.x, p.y); fill(st, ids); tidy(st); }   // 狭い画面ではドックせず、浮かせて出す
                    });
                    (L.stacks || []).forEach(s => { const p = (Number.isFinite(s.x) && Number.isFinite(s.y)) ? s : defaultPos(); const st = newStack(p.x, p.y); fill(st, s.ids); if (s.collapsed) st.classList.add('collapsed'); if (s.tabs) { st.classList.add('tabbed'); st._active = s.active; } tidy(st); });
                    restoring = false;
                })();
            })();
})();

// ---- 描画ループ ----
let fpsV = 60, tPrev = performance.now(), fN = 0;
(function loop() {
    requestAnimationFrame(loop);
    const now = performance.now(); fpsV += (1000 / Math.max(1, now - tPrev) - fpsV) * 0.1; tPrev = now;
    if (++fN % 20 === 0) $('fps').textContent = fpsV.toFixed(0) + ' fps';
    if (auto.some(Boolean)) { auto.forEach((a, k) => { if (a) ang[k] = norm(ang[k] + 0.01 * spd * RATE[k]); }); update(); if (fN % 6 === 0) sync(); }
    ctl.update(); ren.render(scene, cam);
})();
onWindowResize(); update(); sync();
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
